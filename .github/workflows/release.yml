# GitHub actions workflow which builds and publishes the python package wheel archive.
name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # trigger manually

# Disable all permissions for the GITHUB_TOKEN access token by default.
permissions: {}

# cancel multiple workflows running on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless signing of the attestations via GitHub OIDC
      attestations: write # write to GitHub's attestation store
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: false

      # produces both release artifacts: the wheel (.whl) and the sdist (.tar.gz)
      - name: Build wheel and sdist
        run: uv build

      # SBOM predicate for the release. Scans the source tree; emitted as a file
      # so it can be both attested and published as a release asset.
      - name: Generate SBOM for release
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: ./
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-artifact-retention: 1
          upload-release-assets: false

      # Attest the CycloneDX SBOM against BOTH release artifacts (glob subject).
      # Blob attestations land in GitHub's attestation API + public Rekor
      # (hashes only). The predicate itself is published separately below.
      - name: Attest SBOM
        id: attest-sbom
        # if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          predicate-type: https://cyclonedx.org/bom
          predicate-path: sbom.cdx.json

      # Attest the SLSA provenance against BOTH release artifacts (glob subject).
      - name: Attest Provenance
        id: attest-provenance
        # if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ github.workspace }}/dist/*, ${{ github.workspace }}/sbom.cdx.json'

      # Publish the artifacts and predicate files as release assets.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
            # distinct attestation bundle names
            cp "$SBOM_BUNDLE" sbom.cdx.in-toto.sigstore.json
            cp "$PROV_BUNDLE" provenance.in-toto.sigstore.json

            # create release on ref name
            gh release create "$GITHUB_REF_NAME" \
            dist/* \
            sbom.cdx.in-toto.sigstore.json \
            provenance.in-toto.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
          PROV_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
